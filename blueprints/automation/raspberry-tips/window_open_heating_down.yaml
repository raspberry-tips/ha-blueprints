blueprint:
  name: Window open → heating down, all closed → restore
  description: >-
    Turns the heating in a room down while a window or door is open and puts it
    back exactly as it was once every selected window is closed again.


    - Several windows per room: the heating only comes back when all of them are
    closed.

    - Restores the previous mode and setpoint, including "auto" (thermostat
    schedules such as Homematic AUTO keep running instead of being forced to
    "heat").

    - A second window opening while the heating is already down does not
    overwrite the saved state.

    - After a Home Assistant restart while a window was open the saved state is
    gone; the fallback mode below is used instead.


    Works with any window/door contact (Zigbee, Z-Wave, Homematic, Shelly ...)
    and any climate entity. Guide:
    https://raspberry.tips/en/smart-home/window-open-heating-off-home-assistant
  domain: automation
  author: raspberry.tips
  source_url: https://github.com/raspberry-tips/ha-blueprints/blob/main/blueprints/automation/raspberry-tips/window_open_heating_down.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: Room
      icon: mdi:window-open-variant
      input:
        window_sensors:
          name: Window and door contacts
          selector:
            entity:
              domain: binary_sensor
              device_class:
                - window
                - door
                - opening
              multiple: true
        thermostats:
          name: Thermostats
          selector:
            entity:
              domain: climate
              multiple: true
    behaviour:
      name: Behaviour
      icon: mdi:cog
      input:
        open_delay:
          name: Turn down after the window has been open for
          description: Short airing does not touch the heating.
          default:
            minutes: 1
          selector:
            duration:
        close_delay:
          name: Restore after all windows have been closed for
          default:
            seconds: 30
          selector:
            duration:
        open_action:
          name: While open
          default: frost
          selector:
            select:
              options:
                - label: Set to a low temperature (frost protection)
                  value: frost
                - label: Turn the thermostat off
                  value: "off"
        frost_temperature:
          name: Low temperature
          default: 5
          selector:
            number:
              min: 4
              max: 16
              step: 0.5
              unit_of_measurement: °C
        fallback_mode:
          name: Fallback mode
          description: Used on close when no saved state exists (e.g. Home Assistant restarted while the window was open).
          default: auto
          selector:
            select:
              options:
                - auto
                - heat
                - heat_cool
                - "off"

mode: queued
max_exceeded: silent

variables:
  window_sensors: !input window_sensors
  thermostats: !input thermostats
  open_action: !input open_action
  frost_temperature: !input frost_temperature
  fallback_mode: !input fallback_mode
  # One snapshot scene per automation instance.
  snapshot_id: "window_restore_{{ this.entity_id | replace('automation.', '') }}"
  snapshot_scene: "scene.{{ snapshot_id }}"

triggers:
  - trigger: state
    entity_id: !input window_sensors
    to: "on"
    for: !input open_delay
    id: opened
  - trigger: state
    entity_id: !input window_sensors
    to: "off"
    for: !input close_delay
    id: closed

actions:
  - choose:
      - alias: A window has been open long enough
        conditions:
          - condition: trigger
            id: opened
          # Do not snapshot an already lowered state when a second window opens.
          - "{{ expand(snapshot_scene) | count == 0 }}"
        sequence:
          - action: scene.create
            data:
              scene_id: "{{ snapshot_id }}"
              snapshot_entities: "{{ thermostats }}"
          - repeat:
              for_each: "{{ thermostats }}"
              sequence:
                - if:
                    - "{{ open_action == 'off' }}"
                  then:
                    - action: climate.set_hvac_mode
                      continue_on_error: true
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hvac_mode: "off"
                  else:
                    # Never go below what the thermostat accepts (many refuse values under 5 or 7 °C).
                    - action: climate.set_temperature
                      continue_on_error: true
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hvac_mode: heat
                        temperature: >-
                          {{ [frost_temperature | float, state_attr(repeat.item, 'min_temp') | float(0)] | max }}

      - alias: All windows closed again
        conditions:
          - condition: trigger
            id: closed
          - condition: state
            entity_id: !input window_sensors
            state: "off"
        sequence:
          - if:
              # A scene's state stays "unknown" until it is activated, so check that it exists.
              - "{{ expand(snapshot_scene) | count > 0 }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ snapshot_scene }}"
              - action: scene.delete
                target:
                  entity_id: "{{ snapshot_scene }}"
            else:
              # Only act if the heating still looks lowered, never override a manual change.
              - repeat:
                  for_each: "{{ thermostats }}"
                  sequence:
                    - if:
                        - >-
                          {{ is_state(repeat.item, 'off') if open_action == 'off'
                             else (state_attr(repeat.item, 'temperature') | float(99))
                                  <= [frost_temperature | float, state_attr(repeat.item, 'min_temp') | float(0)] | max }}
                      then:
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            hvac_mode: "{{ fallback_mode }}"
